<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Review pipeline: the diff goes to three reviewers in parallel. Their findings merge by file and line. Critical and high findings go to a reviewer from a different author who tries to refute them. Survivors face a devil's advocate. Everything lands in review.json with a verdict, and a person approves at G3.">
  <style>
    .bg { fill: #ffffff; }
    .ln { stroke: #1b2230; fill: none; }
    .fg { fill: #1b2230; }
    .mu { fill: #5b6577; }
    .ac { fill: #0f6b5c; }
    .on { fill: #ffffff; }
    .t { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ln { stroke: #e4e8ef; }
      .fg { fill: #e4e8ef; }
      .mu { fill: #9aa4b5; }
      .ac { fill: #4cc3a8; }
      .on { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="fg" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="372" rx="8"/>
  <g class="ln" stroke-width="1.5">
    <rect x="10" y="140" width="100" height="60" rx="6"/>
    <rect x="160" y="40" width="190" height="52" rx="6"/>
    <rect x="160" y="144" width="190" height="52" rx="6"/>
    <rect x="160" y="248" width="190" height="52" rx="6"/>
    <rect x="400" y="140" width="130" height="60" rx="6"/>
    <rect x="590" y="40" width="160" height="60" rx="6"/>
    <rect x="590" y="240" width="160" height="60" rx="6"/>
    <rect x="810" y="40" width="170" height="60" rx="6" stroke-dasharray="5 3"/>
    <rect x="810" y="240" width="170" height="60" rx="6"/>
    <line x1="110" y1="170" x2="158" y2="66" marker-end="url(#a2)"/>
    <line x1="110" y1="170" x2="158" y2="170" marker-end="url(#a2)"/>
    <line x1="110" y1="170" x2="158" y2="274" marker-end="url(#a2)"/>
    <line x1="350" y1="66" x2="398" y2="164" marker-end="url(#a2)"/>
    <line x1="350" y1="170" x2="398" y2="170" marker-end="url(#a2)"/>
    <line x1="350" y1="274" x2="398" y2="176" marker-end="url(#a2)"/>
    <polyline points="530,160 560,160 560,70 588,70" marker-end="url(#a2)"/>
    <polyline points="530,180 560,180 560,270 588,270" marker-end="url(#a2)"/>
    <line x1="750" y1="70" x2="808" y2="70" marker-end="url(#a2)"/>
    <line x1="750" y1="270" x2="808" y2="270" marker-end="url(#a2)"/>
    <line x1="895" y1="100" x2="895" y2="238" marker-end="url(#a2)"/>
    <line x1="895" y1="300" x2="895" y2="320" marker-end="url(#a2)"/>
  </g>
  <rect class="ac" x="835" y="322" width="120" height="34" rx="17"/>
  <g class="fg t" font-size="14" font-weight="700" text-anchor="middle">
    <text x="60" y="167">Diff</text>
    <text x="465" y="167">Merge</text>
    <text x="670" y="62">Verify</text>
    <text x="670" y="262">Advisories</text>
    <text x="895" y="65">Devil's advocate</text>
    <text x="895" y="265">review.json</text>
  </g>
  <text class="on t" x="895" y="344" font-size="13" font-weight="700" text-anchor="middle">You decide · G3</text>
  <g class="m" font-size="11" text-anchor="middle">
    <text class="mu" x="60" y="184">+ size</text>
    <text class="fg" x="255" y="62">ecc</text><text class="mu" x="255" y="77">code-review</text>
    <text class="fg" x="255" y="166">mattpocock-skills</text><text class="mu" x="255" y="181">code-review</text>
    <text class="fg" x="255" y="270">superpowers</text><text class="mu" x="255" y="285">requesting-code-review</text>
    <text class="mu" x="465" y="184">same file:line = 1</text>
    <text class="mu" x="670" y="78">CRITICAL + HIGH</text><text class="mu" x="670" y="92">other author refutes</text>
    <text class="mu" x="670" y="278">MEDIUM and lower</text><text class="mu" x="670" y="292">kept, not blocking</text>
    <text class="mu" x="895" y="82">attacks the consensus</text>
    <text class="mu" x="895" y="282">PASS · ADVISORIES · FAIL</text>
  </g>
  <g class="mu t" font-size="12">
    <text x="255" y="22" text-anchor="middle">work alone, every claim needs proof</text>
    <text x="779" y="62" text-anchor="middle">survivors</text>
    <text x="895" y="16" text-anchor="middle">runs only if: size allows, nothing refuted,</text>
    <text x="895" y="30" text-anchor="middle">evidence of 2+ kinds</text>
    <text x="903" y="172">+ objections</text>
  </g>
</svg>
